name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, dom, gd

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Generate key
        run: php artisan key:generate

      # Every Document parses and describes itself correctly. This is the check
      # that keeps a malformed Document from reaching the server, where it would
      # fail the build and block the deploy queue behind it.
      - name: Validate Documents
        run: php artisan blog:validate

      # A full build: the Index, sitemap, search index and social cards, plus a
      # render of all 157 Documents. If anything no longer renders, it fails
      # here rather than on a reader's page load.
      - name: Build
        run: php artisan blog:build

      - name: Tests
        run: vendor/bin/phpunit

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger deployment
        env:
          FORGE_SERVER_ID: ${{ secrets.FORGE_SERVER_ID }}
          FORGE_SITE_ID: ${{ secrets.FORGE_SITE_ID }}
          FORGE_DEPLOYMENT_TOKEN: ${{ secrets.FORGE_DEPLOYMENT_TOKEN }}
        run: curl -sS --fail "https://forge.laravel.com/servers/${FORGE_SERVER_ID}/sites/${FORGE_SITE_ID}/deploy/http?token=${FORGE_DEPLOYMENT_TOKEN}"
